<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روابط التواصل الإجتماعي | مريم فنتج</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-bg: #0f172a;
            --accent-color: #38bdf8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: var(--primary-bg);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* لمسة الخلفية المتحركة */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            filter: blur(80px);
            top: -50px;
            right: -50px;
            z-index: -1;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(-100px, 100px); }
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            margin-bottom: 20px;
            object-fit: cover;
            padding: 5px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .link-card i {
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .link-card span {
            font-weight: 500;
        }

        /* تذيل الصفحة */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
        }

        /* تأثير النبض للأيقونات المهمة */
        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(56, 189, 248, 0.4); }
            100% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.ibb.co/XZx30q1G/1775198961854.jpg" alt="Profile" class="profile-img">
        
        <h1>مريم فنتج</h1>
        <p>تلبسية لحاف وشراشف</p>

        <div class="links-wrapper">
            <a href="#" class="link-card">
                <i class="fab fa-telegram"></i>
                <span>قناتي على تليجرام</span>
                <i class="fas fa-chevron-left"></i>
            </a>

            <a href="https://www.facebook.com/share/18Geahymgj/" class="link-card pulse">
                <i class="fab fa-facebook"></i>
                <span> صفحتي على الفيسبوك</span>
                <i class="fas fa-chevron-left"></i>
            </a>

            <a href="https://www.instagram.com/fntjmrym?igsh=eHZzOXc1ZDAzczd6&utm_source=qr" class="link-card">
                <i class="fab fa-instagram"></i>                
                <span>حسابي الشخصي</span>
                <i class="fas fa-chevron-left"></i>
            </a>

            <a href="https://wa.me/qr/EQQUWET25YDPI1" class="link-card">
                <i class="fab fa-whatsapp"></i>

                <span>حسابي على الواتس اب</span>
                <i class="fas fa-chevron-left"></i>
            </a>
        </div>

        <div class="footer">
            تم التصميم بكل ❤️
        </div>
    </div>

</body>
</html>
