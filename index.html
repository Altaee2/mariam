    <style>
        :root {
            --primary-bg: #0f172a;
            --accent-color: #38bdf8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: var(--primary-bg);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* لمسة الخلفية المتحركة */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            filter: blur(80px);
            top: -50px;
            right: -50px;
            z-index: -1;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(-100px, 100px); }
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            margin-bottom: 20px;
            object-fit: cover;
            padding: 5px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .link-card i {
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .link-card span {
            font-weight: 500;
        }

        /* تذيل الصفحة */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
        }

        /* تأثير النبض للأيقونات المهمة */
        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(56, 189, 248, 0.4); }
            100% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
        }
        /* تنسيق قسم الباركود */
        .qr-section {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px dashed var(--glass-border);
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        #qrcode img {
            padding: 10px;
            background: white;
            border-radius: 8px;
        }

        .download-btn {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: var(--accent-color);
            color: var(--primary-bg);
        }
        .link-card::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
}

.link-card:hover::after {
    left: 100%;
    transition: 0.5s;
}
    </style>
</head>
<body>

<script>
function sharePage() {
    if (navigator.share) {
        navigator.share({
            title: document.title,
            url: window.location.href
        }).catch(console.error);
    } else {
        alert("المتصفح لا يدعم المشاركة المباشرة، انسخ الرابط يدوياً.");
    }
}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        // توليد الباركود لرابط الصفحة الحالية
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            text: window.location.href, // سيأخذ رابط موقعك تلقائياً
            width: 128,
            height: 128,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // وظيفة تحميل الباركود كصورة
        function downloadQR() {
            var img = document.querySelector('#qrcode img');
            var link = document.createElement('a');
            link.href = img.src;
            link.download = 'QR_Marem_Vintage.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
